<svg viewBox="0 0 560 720" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030610"/>
      <stop offset="55%" stop-color="#081226"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
  </defs>
  <rect width="560" height="720" fill="url(#bg2)"/>
  <circle cx="120" cy="90" r="140" fill="#5b49ff" fill-opacity="0.12"/>
  <circle cx="460" cy="620" r="160" fill="#00d1ff" fill-opacity="0.08"/>

  <!-- card -->
  <rect x="80" y="90" width="400" height="540" rx="18" fill="#080e1f" fill-opacity="0.85" stroke="#79b2ff" stroke-opacity="0.28"/>

  <circle cx="280" cy="150" r="27" fill="none" stroke="#ffd76a" stroke-width="1.4"/>
  <text x="280" y="158" font-family="Georgia, serif" font-size="24" fill="#ffd76a" text-anchor="middle">✦</text>
  <text x="280" y="204" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#edf5ff" text-anchor="middle" letter-spacing="4">SKILLMON</text>
  <text x="280" y="222" font-family="sans-serif" font-size="9" fill="#93a0b9" text-anchor="middle" letter-spacing="3">COLLECT · LEARN · GROW</text>

  <!-- tabs -->
  <rect x="110" y="248" width="340" height="42" rx="10" fill="#0c1730" stroke="#76a0dc" stroke-opacity="0.3"/>
  <rect x="110" y="248" width="170" height="42" rx="10" fill="#1c3a63" fill-opacity="0.55"/>
  <text x="195" y="274" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">登入</text>
  <text x="365" y="274" font-family="sans-serif" font-size="14" fill="#8d9bb8" text-anchor="middle">註冊</text>

  <!-- fields -->
  <text x="110" y="322" font-family="sans-serif" font-size="11" fill="#9aa8c1" letter-spacing="1">帳號</text>
  <rect x="110" y="330" width="340" height="42" rx="9" fill="#08101e" stroke="#76a0dc" stroke-opacity="0.3"/>
  <text x="126" y="357" font-family="sans-serif" font-size="13" fill="#4c5975">輸入帳號</text>

  <text x="110" y="398" font-family="sans-serif" font-size="11" fill="#9aa8c1" letter-spacing="1">密碼</text>
  <rect x="110" y="406" width="340" height="42" rx="9" fill="#08101e" stroke="#76a0dc" stroke-opacity="0.3"/>
  <text x="126" y="433" font-family="sans-serif" font-size="13" fill="#4c5975">輸入密碼</text>

  <!-- primary button -->
  <rect x="110" y="470" width="340" height="46" rx="9" fill="#ffd76a" fill-opacity="0.1" stroke="#ffd76a"/>
  <text x="280" y="499" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffe59a" text-anchor="middle">登入</text>

  <!-- divider -->
  <line x1="110" y1="546" x2="230" y2="546" stroke="#76a0dc" stroke-opacity="0.2"/>
  <text x="280" y="551" font-family="sans-serif" font-size="10" fill="#556278" text-anchor="middle">或</text>
  <line x1="330" y1="546" x2="450" y2="546" stroke="#76a0dc" stroke-opacity="0.2"/>

  <!-- guest button, highlighted for first-time users -->
  <rect x="106" y="568" width="348" height="48" rx="10" fill="#55d9ff" fill-opacity="0.1" stroke="#55d9ff" stroke-width="1.6"/>
  <text x="280" y="597" font-family="sans-serif" font-size="13" font-weight="700" fill="#bdf1ff" text-anchor="middle">以訪客身分探索（資料不會保存）</text>

  <text x="280" y="648" font-family="sans-serif" font-size="10" fill="#5c6a85" text-anchor="middle">第一次使用？直接點上面的按鈕就能立即體驗</text>
  <text x="280" y="664" font-family="sans-serif" font-size="10" fill="#5c6a85" text-anchor="middle">全部功能，不需要註冊帳號。</text>

  <!-- callout arrow pointing to guest button -->
  <path d="M 470 592 C 500 592 500 592 500 592" stroke="#55d9ff" stroke-width="2" fill="none"/>
  <polygon points="490,585 505,592 490,599" fill="#55d9ff"/>
</svg>
